<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">macOS Container Dev Containers</title>

  <defs>
    <linearGradient id="mdc-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C90A4"/>
      <stop offset=".38" stop-color="#A9ABBE"/>
      <stop offset=".8" stop-color="#7C8095"/>
      <stop offset="1" stop-color="#6A6E82"/>
    </linearGradient>
    <radialGradient id="mdc-sheen" cx=".5" cy=".02" r=".85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mdc-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4D6E4"/>
      <stop offset=".16" stop-color="#C5C7D8"/>
      <stop offset=".65" stop-color="#B2B4C8"/>
      <stop offset="1" stop-color="#9EA0B5"/>
    </linearGradient>
    <linearGradient id="mdc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#33374D" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="mdc-dot" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".78" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E3ED"/>
    </radialGradient>

    <!-- glass tube: lit from above, solid and dark at the base so the edge stays crisp -->
    <linearGradient id="mdc-edge" gradientUnits="userSpaceOnUse" x1="0" y1="101" x2="0" y2="219">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".2" stop-color="#F5F6FB"/>
      <stop offset=".46" stop-color="#DFE2ED"/>
      <stop offset=".68" stop-color="#BCC0D2"/>
      <stop offset=".84" stop-color="#9398AD"/>
      <stop offset=".93" stop-color="#5C6176"/>
      <stop offset="1" stop-color="#44495D"/>
    </linearGradient>
    <linearGradient id="mdc-edge-lit" gradientUnits="userSpaceOnUse" x1="0" y1="101" x2="0" y2="219">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".76" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="mdc-shadow" x="-30%" y="-45%" width="160%" height="200%">
      <feDropShadow dx="0" dy="4.5" stdDeviation="5" flood-color="#1A1E30" flood-opacity=".36"/>
    </filter>
    <filter id="mdc-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- frosted grey tile -->
  <rect width="256" height="256" rx="58" fill="url(#mdc-tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#mdc-sheen)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5"
        fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="3"/>

  <!-- container row -->
  <g filter="url(#mdc-shadow)">
    <rect x="37" y="38" width="182" height="53" rx="26.5" fill="url(#mdc-glass)"/>
  </g>
  <rect x="38.5" y="39.5" width="179" height="50" rx="25"
        fill="none" stroke="url(#mdc-rim)" stroke-width="2.4"/>
  <circle cx="191" cy="64.5" r="21.5" fill="#FFFFFF" opacity=".26" filter="url(#mdc-glow)"/>
  <circle cx="191" cy="64.5" r="15.5" fill="url(#mdc-dot)"/>

  <!-- the dev container: hollow glass box filling the lower two row slots -->
  <g>
    <path d="M41.72 136.34 L128 165 L214.28 136.34 M128 165 L128 215.68" fill="none" stroke="url(#mdc-edge)" stroke-width="11"
          stroke-linejoin="round" stroke-linecap="butt"/>
    <path d="M109.13 107.63 Q128 101 146.87 107.63 L200.13 126.37 Q219 133 219 153 L219 167 Q219 187 200.13 193.63 L146.87 212.37 Q128 219 109.13 212.37 L55.87 193.63 Q37 187 37 167 L37 153 Q37 133 55.87 126.37 Z" fill="none" stroke="url(#mdc-edge)" stroke-width="11"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- inner specular core -->
  <path d="M41.72 136.34 L128 165 L214.28 136.34 M128 165 L128 215.68" fill="none" stroke="url(#mdc-edge-lit)" stroke-width="3.5"
        stroke-linejoin="round" stroke-linecap="butt"/>
  <path d="M109.13 107.63 Q128 101 146.87 107.63 L200.13 126.37 Q219 133 219 153 L219 167 Q219 187 200.13 193.63 L146.87 212.37 Q128 219 109.13 212.37 L55.87 193.63 Q37 187 37 167 L37 153 Q37 133 55.87 126.37 Z" fill="none" stroke="url(#mdc-edge-lit)" stroke-width="3.7"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>

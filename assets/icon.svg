<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">macOS Container Dev Containers</title>

  <defs>
    <linearGradient id="mdc-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C90A4"/>
      <stop offset=".38" stop-color="#A9ABBE"/>
      <stop offset=".8" stop-color="#7C8095"/>
      <stop offset="1" stop-color="#6A6E82"/>
    </linearGradient>
    <radialGradient id="mdc-sheen" cx=".5" cy=".02" r=".85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mdc-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4D6E4"/>
      <stop offset=".16" stop-color="#C5C7D8"/>
      <stop offset=".65" stop-color="#B2B4C8"/>
      <stop offset="1" stop-color="#9EA0B5"/>
    </linearGradient>
    <linearGradient id="mdc-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#33374D" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="mdc-dot" cx=".38" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".78" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E3ED"/>
    </radialGradient>

    <!-- glass tube: lit from above, settling into shadow at the base -->
    <linearGradient id="mdc-edge" gradientUnits="userSpaceOnUse" x1="0" y1="86" x2="0" y2="230">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#F2F3F9"/>
      <stop offset=".5" stop-color="#CDD0E0"/>
      <stop offset=".78" stop-color="#989CB3"/>
      <stop offset="1" stop-color="#757A91"/>
    </linearGradient>
    <linearGradient id="mdc-edge-lit" gradientUnits="userSpaceOnUse" x1="0" y1="86" x2="0" y2="230">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".76" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="mdc-shadow" x="-30%" y="-45%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#1A1E30" flood-opacity=".38"/>
    </filter>
    <filter id="mdc-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="mdc-edge-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#141828" flood-opacity=".4"/>
    </filter>
    <filter id="mdc-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- frosted grey tile -->
  <rect width="256" height="256" rx="58" fill="url(#mdc-tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#mdc-sheen)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5"
        fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="3"/>

  <!-- the container row -->
  <g filter="url(#mdc-shadow)">
    <rect x="44" y="28" width="168" height="44" rx="22" fill="url(#mdc-glass)"/>
  </g>
  <rect x="45.5" y="29.5" width="165" height="41" rx="20.5"
        fill="none" stroke="url(#mdc-rim)" stroke-width="2.2"/>
  <circle cx="186" cy="50" r="17" fill="#FFFFFF" opacity=".28" filter="url(#mdc-glow)"/>
  <circle cx="186" cy="50" r="12" fill="url(#mdc-dot)"/>

  <!-- the dev container: a hollow glass frame, true isometric proportions -->
  <ellipse cx="128" cy="242" rx="50" ry="8"
           fill="#141828" opacity=".3" filter="url(#mdc-soft)"/>

  <g filter="url(#mdc-edge-shadow)">
    <path d="M69.54 124.25 L128 158 L186.46 124.25 M128 158 L128 225.5" fill="none" stroke="url(#mdc-edge)" stroke-width="9"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M112.41 95 Q128 86 143.59 95 L174.77 113 Q190.35 122 190.35 140 L190.35 176 Q190.35 194 174.77 203 L143.59 221 Q128 230 112.41 221 L81.23 203 Q65.65 194 65.65 176 L65.65 140 Q65.65 122 81.23 113 Z" fill="none" stroke="url(#mdc-edge)" stroke-width="9"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- inner specular core -->
  <path d="M69.54 124.25 L128 158 L186.46 124.25 M128 158 L128 225.5" fill="none" stroke="url(#mdc-edge-lit)" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M112.41 95 Q128 86 143.59 95 L174.77 113 Q190.35 122 190.35 140 L190.35 176 Q190.35 194 174.77 203 L143.59 221 Q128 230 112.41 221 L81.23 203 Q65.65 194 65.65 176 L65.65 140 Q65.65 122 81.23 113 Z" fill="none" stroke="url(#mdc-edge-lit)" stroke-width="3.2"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>

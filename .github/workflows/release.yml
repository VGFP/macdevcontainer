name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message || '', 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          BUMP="${{ github.event.inputs.version }}"
          if [ -z "$BUMP" ]; then
            BUMP=patch
          fi
          pnpm version "$BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping release."
            git checkout -- package.json pnpm-lock.yaml
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.version.outputs.skip != 'true'
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"

      - name: Package VSIX
        if: steps.version.outputs.skip != 'true'
        run: pnpm package

      - name: Push version bump
        if: steps.version.outputs.skip != 'true'
        run: git push origin HEAD:main

      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" macdevcontainer.vsix \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: steps.version.outputs.skip != 'true' && env.VSCE_PAT != ''
        run: pnpm exec vsce publish --packagePath macdevcontainer.vsix -p "$VSCE_PAT"

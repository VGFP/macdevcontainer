name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Check out the CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for an existing release tag
        id: existing
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit already has a release tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version locally
        if: steps.existing.outputs.skip != 'true'
        id: version
        run: |
          BUMP="${{ github.event.inputs.version }}"
          if [ -z "$BUMP" ]; then
            BUMP=patch
          fi
          export BUMP
          export LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          VERSION="$(node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const bump = process.env.BUMP || 'patch';
          const tag = (process.env.LATEST_TAG || '').replace(/^v/, '');
          const base = /^\d+\.\d+\.\d+$/.test(tag) ? tag : pkg.version;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(base);
          if (!match) {
            console.error(`Invalid base version: ${base}`);
            process.exit(1);
          }
          let [major, minor, patch] = match.slice(1).map(Number);
          if (bump === 'major') {
            major += 1;
            minor = 0;
            patch = 0;
          } else if (bump === 'minor') {
            minor += 1;
            patch = 0;
          } else if (bump === 'patch') {
            patch += 1;
          } else {
            console.error(`Unknown version bump: ${bump}`);
            process.exit(1);
          }
          pkg.version = `${major}.${minor}.${patch}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(pkg.version);
          NODE
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        if: steps.existing.outputs.skip != 'true'
        run: pnpm package

      - name: Create GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" macdevcontainer.vsix \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: steps.existing.outputs.skip != 'true' && env.VSCE_PAT != ''
        run: pnpm exec vsce publish --packagePath macdevcontainer.vsix -p "$VSCE_PAT"

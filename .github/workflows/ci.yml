name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Verify bundled extension
        run: pnpm verify-bundle

      - name: Package extension
        run: pnpm package

      - name: Record the VSIX digest
        run: sha256sum macdevcontainer.vsix | tee macdevcontainer.vsix.sha256

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: macdevcontainer-vsix
          path: |
            macdevcontainer.vsix
            macdevcontainer.vsix.sha256
          if-no-files-found: error
